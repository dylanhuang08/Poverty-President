<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presidential Poverty Crisis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');

        :root {
            --bg-color: #050505;
            --text-color: #33ff33;
            --alert-color: #ff3333;
            --warning-color: #ffaa00;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000;
            font-family: 'Courier Prime', 'Courier New', Courier, monospace;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #crt-container {
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 850px;
            background-color: var(--bg-color);
            border: 20px solid #1a1a1a;
            border-radius: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: inset 0 0 40px rgba(51, 255, 51, 0.1), 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* CRT Scanline Effect */
        #crt-container::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 10;
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
        }

        header {
            padding: 15px 20px;
            border-bottom: 2px dashed var(--text-color);
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            background-color: #0a1a0a;
            z-index: 5;
            font-weight: bold;
            font-size: 1.1rem;
            text-shadow: 0 0 5px var(--text-color);
        }

        .stat-box { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .stat-label { font-size: 0.8rem; opacity: 0.8; margin-bottom: 4px; }

        .alert-text { color: var(--alert-color); text-shadow: 0 0 5px var(--alert-color); animation: blink 1s infinite; }
        .warning-text { color: var(--warning-color); text-shadow: 0 0 5px var(--warning-color); }

        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.2; } }

        #main-display {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            z-index: 5;
            display: flex;
            flex-direction: column;
        }

        #ascii-art {
            white-space: pre;
            text-align: center;
            font-size: 14px;
            line-height: 1.2;
            margin-bottom: 20px;
            min-height: 150px;
            text-shadow: 0 0 3px var(--text-color);
        }

        #text-content {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 20px;
            text-shadow: 0 0 2px var(--text-color);
        }

        .diff-pos { color: var(--text-color); }
        .diff-neg { color: var(--alert-color); }

        #controls {
            padding: 20px;
            border-top: 2px dashed var(--text-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
            background-color: #081108;
            max-height: 45%;
            overflow-y: auto;
        }

        button {
            background: transparent;
            color: var(--text-color);
            border: 1px solid var(--text-color);
            font-family: inherit;
            font-size: 1.1rem;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            transition: background 0.1s;
            text-shadow: 0 0 3px var(--text-color);
        }

        button:hover {
            background: var(--text-color);
            color: var(--bg-color);
            text-shadow: none;
        }

        .restart-btn {
            margin-top: 20px;
            color: var(--warning-color);
            border-color: var(--warning-color);
            text-align: center;
        }
        
        .restart-btn:hover {
            background: var(--warning-color);
            color: var(--bg-color);
        }

        .hidden { display: none !important; }
        
        .aftermath-box {
            margin-top: 15px; 
            background: #112; 
            padding: 15px; 
            border: 1px dashed #44f;
            color: #ccc;
        }
    </style>
</head>
<body>
    <div id="crt-container">
        <header id="stats-header" class="hidden">
            <div class="stat-box">
                <span class="stat-label">CYCLE</span>
                <span id="ui-turn">1/20</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">POVERTY</span>
                <span id="ui-poverty">10.2%</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">BUDGET</span>
                <span id="ui-budget">$4.0T</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">APPROVAL</span>
                <span id="ui-approval">50%</span>
            </div>
            <div class="stat-box">
                <span class="stat-label">INFLATION</span>
                <span id="ui-inflation">3.0%</span>
            </div>
        </header>

        <div id="main-display">
            <div id="ascii-art"></div>
            <div id="text-content"></div>
        </div>

        <div id="controls"></div>
    </div>

    <script>
        const ASCII = {
            whitehouse: `
        _ _.-'\`-._ _
       ;.'________'.;
        ---------
       /| _  _  _ |\\
      | |[_][_][_]| |
      | |[_][_][_]| |
    __|_|_________|_|__`,
            money: `
       _______
      /       \\
     |  $$$$$  |
     |  $ 4 T  |
     |  $$$$$  |
      \\_______/`,
            protest: `
      \\o/   \\o/   \\o/
       |     |     |
      / \\   / \\   / \\
     [STRIKE] [FAIR WAGE]`,
            factory: `
       | | | |
      _|_|_|_|_
     |         |
     |_________|
    /           \\`,
            graph: `
      ^
    % |    /\\
      |   /  \\
      |  /    \\/\\
      | /
      +----------->
          TIME`,
            newspaper: `
    ___________________
   |  THE DAILY NEWS   |
   |===================|
   |  BREAKING STORY   |
   |                   |
   |===================|
   |___________________|`,
            skull: `
        _____
       /     \\
      | () () |
       \\  ^  /
        |||||`
        };

        let state = {
            turn: 1,
            poverty: 10.2,
            budget: 4.0,
            approval: 50,
            inflation: 3.0
        };

        const UI = {
            header: document.getElementById('stats-header'),
            turn: document.getElementById('ui-turn'),
            poverty: document.getElementById('ui-poverty'),
            budget: document.getElementById('ui-budget'),
            approval: document.getElementById('ui-approval'),
            inflation: document.getElementById('ui-inflation'),
            ascii: document.getElementById('ascii-art'),
            text: document.getElementById('text-content'),
            controls: document.getElementById('controls')
        };

        function fix(num) {
            return Number(Math.round(num + "e2") + "e-2");
        }

        const scenarios = [
            {
                title: "Cycle 1: The Relief Check",
                desc: "The public demands financial relief as living costs rise. Do you issue direct stimulus checks?",
                art: 'money',
                options: [
                    { text: "Universal $1,000 checks", pov: -2.0, bud: -1.5, app: 8, inf: 3.0, aftermath: "Universal checks spurred huge demand. While poverty fell, production couldn't keep up, causing demand-pull inflation that ate into purchasing power." },
                    { text: "Targeted checks for the poor", pov: -1.0, bud: -0.5, app: 3, inf: 1.0, aftermath: "Targeting saved the budget, but phase-outs created a 'welfare cliff' where earning more money meant losing benefits, causing labor friction." },
                    { text: "No checks, prioritize deficit", pov: 0.2, bud: 0, app: -5, inf: -0.5, aftermath: "You held the fiscal line. Inflation cooled slightly, but struggling families fell deeper into arrears." }
                ]
            },
            {
                title: "Cycle 2: Minimum Wage",
                desc: "Strikes erupt demanding a higher federal minimum wage.",
                art: 'protest',
                options: [
                    { text: "Double it immediately", pov: -1.5, bud: 0.2, app: 5, inf: 1.5, aftermath: "Incomes rose, but small businesses immediately invested in automation kiosks to offset payroll costs, spiking youth unemployment." },
                    { text: "Expand Earned Income Tax Credit", pov: -0.8, bud: -0.6, app: 2, inf: 0.2, aftermath: "Subsidizing low wages via tax codes kept people employed but shifted the corporate payroll burden onto the federal treasury." },
                    { text: "Let free market dictate", pov: 0.3, bud: 0, app: -4, inf: -0.2, aftermath: "Firms stayed highly profitable, but local monopolies kept entry-level wages depressed, stalling mobility." }
                ]
            },
            {
                title: "Cycle 3: Housing Crisis",
                desc: "Rent is unaffordable in major cities.",
                art: 'factory',
                options: [
                    { text: "Massive rent vouchers", pov: -1.0, bud: -0.8, app: 4, inf: 1.2, aftermath: "Vouchers without new housing supply just led to bidding wars. Landlords absorbed the vouchers by raising rent." },
                    { text: "National rent control", pov: -0.5, bud: 0, app: 3, inf: -0.5, aftermath: "Current renters rejoiced, but developers realized new construction was unprofitable, causing a long-term housing shortage." },
                    { text: "Deregulate zoning laws", pov: -0.2, bud: 0, app: -1, inf: 0.1, aftermath: "Long-term supply will increase, but the lack of immediate relief alienated voters facing eviction today." }
                ]
            },
            {
                title: "Cycle 4: Healthcare Costs",
                desc: "Medical debt is ruining families.",
                art: 'whitehouse',
                options: [
                    { text: "Medicare for All", pov: -1.8, bud: -1.5, app: 4, inf: 1.5, aftermath: "Medical bankruptcy vanished. But infinite demand with finite supply caused wait times to skyrocket and massive deficit spending." },
                    { text: "Price cap on prescriptions", pov: -0.6, bud: 0.1, app: 5, inf: -0.2, aftermath: "Immediate savings were celebrated. However, pharma companies quietly slashed R&D budgets for future cures." },
                    { text: "Subsidize private insurance", pov: -0.8, bud: -0.7, app: 2, inf: 0.8, aftermath: "More people were covered, but hospitals realized the government was paying, so they systematically raised base prices." }
                ]
            },
            {
                title: "Cycle 5: Corporate Taxes",
                desc: "The deficit is growing. Congress proposes a corporate tax hike.",
                art: 'money',
                options: [
                    { text: "Heavy corporate tax", pov: 0.4, bud: 1.2, app: 2, inf: -0.3, aftermath: "The Treasury swelled. But corporations passed the tax burden to consumers via higher prices and slower hiring." },
                    { text: "Keep rates steady", pov: 0, bud: 0, app: 0, inf: 0, aftermath: "Markets remained stable. Capital allocation continued without policy-induced shocks." },
                    { text: "Tax breaks for expansion", pov: -0.5, bud: -0.8, app: -2, inf: 0.8, aftermath: "A boom in factory building lifted wages, but starved the government of revenue and caused short-term resource inflation." }
                ]
            },
            {
                title: "Cycle 6: Student Debt",
                desc: "Young adults cannot buy homes due to crushing student loans.",
                art: 'graph',
                options: [
                    { text: "Forgive federal loans", pov: -0.7, bud: -1.0, app: 3, inf: 1.5, aftermath: "Freed-up cash caused a consumer spending boom, driving up inflation. Colleges also raised tuition, expecting future bailouts." },
                    { text: "Income-capped payments", pov: -0.4, bud: -0.3, app: 2, inf: 0.3, aftermath: "Averted absolute ruin for graduates, but created moral hazard as students borrowed freely with no intention of full repayment." },
                    { text: "Privatize all loans", pov: 0.5, bud: 0.4, app: -4, inf: -0.4, aftermath: "Banks enforced strict lending standards. The budget improved, but poor students were locked out of higher education." }
                ]
            },
            {
                title: "Cycle 7: Energy Spike",
                desc: "Winter brings massive heating oil price spikes.",
                art: 'factory',
                options: [
                    { text: "Green energy subsidies", pov: -0.4, bud: -0.8, app: 1, inf: 1.2, aftermath: "Created jobs, but transitioning the grid too fast caused instability. Supply hiccups caused massive price volatility." },
                    { text: "Carbon tax + citizen rebate", pov: -0.2, bud: 0.5, app: -2, inf: -0.2, aftermath: "Efficient for emissions, but the initial price shock hit the poor hard before the rebate checks arrived." },
                    { text: "Emergency oil drilling", pov: 0.3, bud: 0.2, app: -3, inf: -1.2, aftermath: "Flooding the market crashed prices, functioning as a massive tax cut for the poor, but ignored long-term climate externalities." }
                ]
            },
            {
                title: "Cycle 8: Childcare Costs",
                desc: "Parents are dropping out of the workforce because daycare is too expensive.",
                art: 'money',
                options: [
                    { text: "Universal free Pre-K", pov: -1.2, bud: -0.9, app: 4, inf: 1.0, aftermath: "Labor force participation jumped, but daycare centers absorbed the subsidies by raising rates on younger toddlers." },
                    { text: "Child tax credit checks", pov: -1.0, bud: -0.6, app: 3, inf: 0.7, aftermath: "Parents optimized their own care, dropping poverty. But it created a permanent structural deficit." },
                    { text: "Deregulate safety ratios", pov: 0.2, bud: 0, app: -4, inf: -0.4, aftermath: "Prices plummeted as one teacher watched more kids. But quality tanked, driving middle-class flight from the system." }
                ]
            },
            {
                title: "Cycle 9: Foreign Trade",
                desc: "Cheap imports are devastating American manufacturing towns.",
                art: 'newspaper',
                options: [
                    { text: "Heavy import tariffs", pov: -0.4, bud: 0.4, app: 2, inf: 2.2, aftermath: "Factory jobs returned, but tariffs acted as a regressive tax. The price of basic goods exploded, hurting purchasing power." },
                    { text: "High-tech manufacturing grants", pov: -0.2, bud: -0.4, app: 1, inf: 0.4, aftermath: "Advanced fabrication plants opened, but they were highly automated and required engineers, doing little for uneducated workers." },
                    { text: "Commit to free trade", pov: 0.5, bud: -0.1, app: -2, inf: -1.5, aftermath: "Consumer prices plummeted, helping everyone. However, specific industrial towns were completely wiped out." }
                ]
            },
            {
                title: "Cycle 10: Infrastructure (Midterm Eve)",
                desc: "The midterms are approaching. You need a signature policy.",
                art: 'graph',
                options: [
                    { text: "Borrow for public works", pov: -0.8, bud: -1.0, app: 3, inf: 1.8, aftermath: "Construction jobs boomed, crushing poverty. But the deficit spending forced the Fed to hike rates to fight inflation." },
                    { text: "Private toll roads", pov: -0.3, bud: -0.1, app: 1, inf: 0.4, aftermath: "Wall Street funded the roads. But steep daily tolls acted as a highly regressive tax on poor commuters." },
                    { text: "Cancel projects (Austerity)", pov: 0.6, bud: 0.6, app: -3, inf: -1.0, aftermath: "You championed fiscal sanity. But sudden contract cancellations led to immediate blue-collar layoffs." }
                ]
            },
            {
                title: "Cycle 11: Food Inflation",
                desc: "Droughts have caused grocery prices to soar.",
                art: 'factory',
                options: [
                    { text: "Freeze grocery prices", pov: -0.4, bud: 0, app: 4, inf: -1.2, aftermath: "Food became cheap on paper. But farmers, unable to cover costs, stopped planting, leading to empty shelves." },
                    { text: "Expand Food Stamps (SNAP)", pov: -0.9, bud: -0.5, app: 2, inf: 1.0, aftermath: "The poor could afford to eat, but pumping more money into a limited food supply caused prices to rise for the middle class." },
                    { text: "Subsidize farm production", pov: -0.3, bud: -0.4, app: 0, inf: -0.6, aftermath: "Farmers flooded the market, lowering prices naturally. But you created permanent corporate farm reliance on subsidies." }
                ]
            },
            {
                title: "Cycle 12: AI & Automation",
                desc: "Robots are rapidly displacing warehouse workers.",
                art: 'graph',
                options: [
                    { text: "Tax automated labor", pov: -0.2, bud: 0.5, app: 1, inf: 1.2, aftermath: "Saved jobs short-term, but crippled national productivity growth. US goods became uncompetitive globally." },
                    { text: "Worker retraining programs", pov: -0.5, bud: -0.4, app: 2, inf: 0.2, aftermath: "Young workers adapted, but older demographics struggled with the friction, leading to structural unemployment." },
                    { text: "Embrace automation", pov: 0.6, bud: 0, app: -3, inf: -1.2, aftermath: "Prices of goods plummeted due to efficiency. But millions of obsolete workers were violently cast into poverty." }
                ]
            },
            {
                title: "Cycle 13: Aging Population",
                desc: "Social Security is running out of money.",
                art: 'whitehouse',
                options: [
                    { text: "Raise retirement age", pov: 0.7, bud: 0.8, app: -5, inf: -0.3, aftermath: "Saved the budget, but broken manual laborers were forced to work longer, spiking elderly poverty." },
                    { text: "Remove payroll tax cap", pov: -0.3, bud: 0.9, app: 1, inf: -0.1, aftermath: "Taxing the rich solved the math. Velocity of money slowed slightly at the top, but systemic collapse was averted." },
                    { text: "Privatize pensions", pov: 0.3, bud: 0.3, app: -3, inf: 0.5, aftermath: "Savvy investors got rich. But financially illiterate seniors lost everything in market dips." }
                ]
            },
            {
                title: "Cycle 14: Railroad Strike",
                desc: "Rail workers threaten to halt the supply chain.",
                art: 'protest',
                options: [
                    { text: "Force companies to concede", pov: -0.6, bud: 0, app: 2, inf: 1.3, aftermath: "Workers got raises. Railroad monopolies immediately passed the labor cost into shipping rates, inflating all goods." },
                    { text: "Break the strike via exec order", pov: 0.5, bud: 0, app: -2, inf: -0.5, aftermath: "Trains ran, keeping goods cheap. But destroying union leverage stagnated blue-collar wages for a decade." },
                    { text: "Nationalize the rails", pov: -0.4, bud: -0.8, app: -1, inf: 0.4, aftermath: "The government took over. Service was maintained, but bureaucratic inefficiency ballooned operational costs." }
                ]
            },
            {
                title: "Cycle 15: Welfare Reform",
                desc: "Critics say welfare discourages work.",
                art: 'newspaper',
                options: [
                    { text: "Strict work requirements", pov: 0.8, bud: 0.4, app: 1, inf: -0.2, aftermath: "Able-bodied people worked, but bureaucratic friction caused the severely disabled to lose aid, spiking visible street poverty." },
                    { text: "Remove conditionality", pov: -0.9, bud: -0.7, app: 2, inf: 0.8, aftermath: "Aid reached everyone instantly. But the cost was astronomical, and systemic inflation ate away at the gains." },
                    { text: "Shift to block grants", pov: 0.4, bud: 0.5, app: -1, inf: 0, aftermath: "States ran their own programs. Rich states succeeded, poor states slashed benefits to the bone." }
                ]
            },
            {
                title: "Cycle 16: Auto Industry Collapse",
                desc: "A major automaker is going bankrupt. 200,000 jobs at risk.",
                art: 'factory',
                options: [
                    { text: "Bail them out", pov: -0.1, bud: -0.9, app: 1, inf: 0.6, aftermath: "Saved a localized apocalypse, but created moral hazard: 'Too big to fail' means socializing corporate losses." },
                    { text: "Let them fail (Capitalism)", pov: 1.6, bud: 0, app: -4, inf: -0.8, aftermath: "Creative destruction freed up capital for EV startups, but the immediate localized devastation was brutal." },
                    { text: "Buy an equity stake", pov: 0, bud: -0.6, app: 0, inf: 0.3, aftermath: "Government ownership saved jobs and later returned a profit, but terrified private markets of nationalization." }
                ]
            },
            {
                title: "Cycle 17: Wealth Tax",
                desc: "The public demands a tax on billionaires' unsold stock.",
                art: 'money',
                options: [
                    { text: "Tax unrealized gains", pov: -0.2, bud: 1.0, app: 2, inf: -0.5, aftermath: "Brought in massive revenue, but accurately valuing private firms proved impossible. Capital flight ensued." },
                    { text: "Tax capital gains as income", pov: -0.3, bud: 0.8, app: 1, inf: -0.3, aftermath: "Leveled the playing field. But venture capital dried up, severely slowing new innovative startups." },
                    { text: "Lower taxes for investors", pov: 0.5, bud: -0.5, app: -3, inf: 0.6, aftermath: "Created a massive stock boom, but benefits accrued entirely to the top 10%, exacerbating wealth stratification." }
                ]
            },
            {
                title: "Cycle 18: Labor Shortage",
                desc: "Farms and construction sites lack workers.",
                art: 'protest',
                options: [
                    { text: "Massive temporary work visas", pov: 0.4, bud: 0.2, app: -1, inf: -1.6, aftermath: "Labor influx resolved bottlenecks, crashing inflation. But intense wage competition at the bottom ticked domestic poverty up." },
                    { text: "Close borders, fine employers", pov: -0.3, bud: -0.1, app: 1, inf: 1.8, aftermath: "Shrinking the labor pool gave domestic workers massive bargaining power. But lack of farm workers skyrocketed food prices." },
                    { text: "Subsidize automation research", pov: 0.2, bud: -0.3, app: 0, inf: 0.2, aftermath: "Long-term fix for labor shortages, but didn't help the rotting harvests this season." }
                ]
            },
            {
                title: "Cycle 19: The Surplus Dilemma",
                desc: "You found a small budgetary surplus.",
                art: 'graph',
                options: [
                    { text: "Fund Fusion Energy", pov: 0.1, bud: -0.4, app: 0, inf: -0.1, aftermath: "Incredible long-term productivity multiplier for the next generation, but did nothing to help poverty today." },
                    { text: "Final $500 stimulus check", pov: -0.9, bud: -0.6, app: 3, inf: 1.1, aftermath: "Sacrificed long-term growth for short-term consumption. Poverty dropped, but inflation spiked again." },
                    { text: "Pay down national debt", pov: 0.3, bud: 0.5, app: -2, inf: -0.4, aftermath: "Fiscal sanity lowered borrowing costs, but voters saw no immediate benefit to their daily lives." }
                ]
            },
            {
                title: "Cycle 20: The Final Act",
                desc: "Your legacy and reelection depend on these final indicators.",
                art: 'whitehouse',
                options: [
                    { text: "Aggressive spending spree", pov: -1.2, bud: -1.0, app: 2, inf: 2.0, aftermath: "Flooded the economy to artificially drive poverty down right before the vote. You risk an inflationary spiral next term." },
                    { text: "Strict austerity", pov: 1.0, bud: 1.2, app: -3, inf: -1.5, aftermath: "Slammed the brakes on spending. Killed inflation beautifully, but the sudden reduction in government demand spiked unemployment." },
                    { text: "Maintain course", pov: 0, bud: 0, app: 0, inf: 0, aftermath: "You made no sudden moves, letting the complex macroeconomic ripples of your 4-year term play out." }
                ]
            }
        ];

        function updateUI() {
            UI.turn.innerText = `${state.turn}/20`;
            UI.poverty.innerText = `${state.poverty.toFixed(1)}%`;
            UI.budget.innerText = `$${state.budget.toFixed(1)}T`;
            UI.approval.innerText = `${state.approval}%`;
            UI.inflation.innerText = `${state.inflation.toFixed(1)}%`;

            UI.poverty.className = state.poverty > 8.0 ? 'alert-text' : (state.poverty > 6.0 ? 'warning-text' : '');
            UI.budget.className = state.budget < 0 ? 'alert-text' : (state.budget < 1.0 ? 'warning-text' : '');
            UI.approval.className = state.approval < 30 ? 'alert-text' : (state.approval < 50 ? 'warning-text' : '');
            UI.inflation.className = state.inflation > 10.0 ? 'alert-text' : (state.inflation > 5.0 ? 'warning-text' : '');
        }

        function clearControls() {
            UI.controls.innerHTML = '';
        }

        function createButton(text, onClick, isRestart = false) {
            const btn = document.createElement('button');
            btn.innerText = text;
            if (isRestart) {
                btn.className = 'restart-btn';
                btn.innerText = `[ RESTART GAME ]`;
            }
            btn.onclick = onClick;
            UI.controls.appendChild(btn);
        }

        function formatDiff(val, unit, invertColors = false) {
            if (val === 0) return `<span style="color:#aaa">0${unit}</span>`;
            let sign = val > 0 ? '+' : '';
            let isPositiveEvent = invertColors ? val < 0 : val > 0;
            let cssClass = isPositiveEvent ? 'diff-pos' : 'diff-neg';
            return `<span class="${cssClass}">${sign}${val.toFixed(1)}${unit}</span>`;
        }

        function loadScenario() {
            updateUI();
            const scenario = scenarios[state.turn - 1];
            
            UI.ascii.innerText = ASCII[scenario.art] || ASCII.whitehouse;
            UI.text.innerHTML = `<strong>${scenario.title}</strong><br><br>${scenario.desc}`;
            
            clearControls();
            
            scenario.options.forEach(opt => {
                let costStr = "";
                if (opt.bud < 0) costStr = `(Cost: $${Math.abs(opt.bud).toFixed(1)}T)`;
                else if (opt.bud > 0) costStr = `(Revenue: $${opt.bud.toFixed(1)}T)`;
                else costStr = `(Cost: $0.0T)`;
                
                createButton(`> ${opt.text} ${costStr}`, () => handleChoice(opt));
            });

            createButton("", initGame, true);
        }

        function handleChoice(option) {
            state.poverty = fix(state.poverty + option.pov);
            state.budget = fix(state.budget + option.bud);
            state.approval = fix(state.approval + option.app);
            state.inflation = fix(state.inflation + option.inf);

            state.poverty = Math.max(0, state.poverty);
            state.approval = Math.min(100, Math.max(0, state.approval));

            playAnimation(option);
        }

        function playAnimation(option) {
            clearControls();
            UI.text.innerHTML = "<strong class='warning-text'>EXECUTING POLICY... THE PUBLIC REACTS...</strong>";
            
            const crowdLines1 = [
                " [JOBS NOW]   [LOWER RENT]  [FAIR WAGES]  [FOOD SECURE]",
                "      |             |             |             |      ",
                "     \\o/           \\o/           \\o/           \\o/     ",
                "      |             |             |             |      ",
                "     / \\           / \\           / \\           / \\     ",
                "  \\o/   \\o/     \\o/   \\o/     \\o/   \\o/     \\o/   \\o/  ",
                "   |     |       |     |       |     |       |     |   ",
                "  / \\   / \\     / \\   / \\     / \\   / \\     / \\   / \\  ",
                " \\o/ \\o/ \\o/   \\o/ \\o/ \\o/   \\o/ \\o/ \\o/   \\o/ \\o/ \\o/ ",
                "  |   |   |     |   |   |     |   |   |     |   |   |  ",
                " / \\ / \\ / \\   / \\ / \\ / \\   / \\ / \\ / \\   / \\ / \\ / \\ "
            ];

            const crowdLines2 = [
                " [JOBS NOW]   [LOWER RENT]  [FAIR WAGES]  [FOOD SECURE]",
                "      |             |             |             |      ",
                "     \\o/           \\o/           \\o/           \\o/     ",
                "      |             |             |             |      ",
                "      |             |             |             |      ",
                "  \\o/   \\o/     \\o/   \\o/     \\o/   \\o/     \\o/   \\o/  ",
                "   |     |       |     |       |     |       |     |   ",
                "   |     |       |     |       |     |       |     |   ",
                " \\o/ \\o/ \\o/   \\o/ \\o/ \\o/   \\o/ \\o/ \\o/   \\o/ \\o/ \\o/ ",
                "  |   |   |     |   |   |     |   |   |     |   |   |  ",
                "   |   |   |     |   |   |     |   |   |     |   |   |  "
            ];
            
            let spaces = 0;
            let tick = 0;
            
            let animInterval = setInterval(() => {
                let padding = " ".repeat(spaces);
                let currentLines = tick % 2 === 0 ? crowdLines1 : crowdLines2;
                
                let frame = currentLines.map(line => {
                    return padding + line;
                }).join('\n');
                
                UI.ascii.innerText = frame;
                spaces += 2;
                tick++;
            }, 120);

            setTimeout(() => {
                clearInterval(animInterval);
                showAftermath(option);
            }, 2400);
        }

        function showAftermath(option) {
            updateUI();
            UI.ascii.innerText = ASCII.newspaper;
            
            let diffHtml = `
                <div class="aftermath-box">
                    <strong>ECONOMIC RIPPLE EFFECTS:</strong><br>
                    Poverty: ${formatDiff(option.pov, '%', true)} (Now: ${state.poverty.toFixed(1)}%)<br>
                    Budget: ${formatDiff(option.bud, 'T', false)} (Now: $${state.budget.toFixed(1)}T)<br>
                    Approval: ${formatDiff(option.app, '%', false)} (Now: ${state.approval}%)<br>
                    Inflation: ${formatDiff(option.inf, '%', true)} (Now: ${state.inflation.toFixed(1)}%)
                </div>
            `;

            UI.text.innerHTML = `<strong>THE AFTERMATH</strong><br><br>${option.aftermath}${diffHtml}`;
            
            clearControls();
            createButton("> NEXT CYCLE", proceedToNextTurn);
            createButton("", initGame, true);
        }

        function proceedToNextTurn() {
            // Strict game over condition check before proceeding
            if (state.approval < 20) return gameOver("IMPEACHED", "Your approval rating dropped below 20%. The public rioted, and Congress removed you from office.");
            if (state.budget < 0) return gameOver("BANKRUPT", "The United States defaulted on its debt. The global economy collapsed.");
            if (state.inflation >= 15) return gameOver("HYPERINFLATION", "Inflation hit 15%. The dollar is practically worthless.");

            if (state.turn === 10) {
                handleMidterms();
                return;
            }

            if (state.turn >= 20) {
                handleEndgame();
                return;
            }

            state.turn++;
            loadScenario();
        }

        function handleMidterms() {
            UI.ascii.innerText = ASCII.newspaper;
            clearControls();

            if (state.poverty > 8.0) {
                state.approval -= 15;
                state.budget = fix(state.budget - 0.5); 
                
                if(state.approval < 20) return gameOver("VOTE OF NO CONFIDENCE", "Your approval crashed below 20% after failing key economic benchmarks during the midterms.");

                UI.text.innerHTML = `<strong>MIDTERM DISASTER</strong><br><br>Poverty is at ${state.poverty.toFixed(1)}%. Voters are furious. You lost Congress, causing gridlock.<br><br><span class="diff-neg">-15% Approval</span><br><span class="diff-neg">-$0.5T Budget (Gridlock)</span>`;
            } else {
                state.approval += 10;
                UI.text.innerHTML = `<strong>MIDTERM VICTORY</strong><br><br>Poverty dropped to ${state.poverty.toFixed(1)}%. You gained a mandate in Congress.<br><br><span class="diff-pos">+10% Approval</span>`;
            }

            createButton("> PROCEED TO CYCLE 11", () => {
                state.turn++;
                loadScenario();
            });
            createButton("", initGame, true);
            updateUI();
        }

        function handleEndgame() {
            UI.header.classList.add('hidden');
            clearControls();

            if (state.poverty <= 6.0) {
                UI.ascii.innerText = ASCII.whitehouse;
                UI.text.innerHTML = `<strong>REELECTION SECURED</strong><br><br>Final Poverty Rate: <span class="diff-pos">${state.poverty.toFixed(1)}%</span><br><br>Congratulations, Mr. President. You made tough choices, managed inflation and budgets, and fulfilled your promise to drive poverty to 6.0% or lower.`;
                createButton("> PLAY AGAIN", initGame);
            } else {
                UI.ascii.innerText = ASCII.skull;
                UI.text.innerHTML = `<strong>VOTED OUT</strong><br><br>Final Poverty Rate: <span class="diff-neg">${state.poverty.toFixed(1)}%</span> (Target was <= 6.0%)<br><br>You failed your core campaign promise. The complex web of economic ripples was too much to handle. You lost the election.`;
                createButton("> RETRY SIMULATION", initGame);
            }
        }

        function gameOver(title, reason) {
            UI.header.classList.add('hidden');
            UI.ascii.innerText = ASCII.skull;
            UI.text.innerHTML = `<strong>GAME OVER: ${title}</strong><br><br>${reason}<br><br>Your administration has suffered a complete collapse.`;
            clearControls();
            createButton("> REBOOT SIMULATION", initGame);
        }

        function initGame() {
            state = { turn: 1, poverty: 10.2, budget: 4.0, approval: 50, inflation: 3.0 };
            UI.header.classList.add('hidden');
            
            UI.ascii.innerText = ASCII.whitehouse;
            UI.text.innerHTML = `
                <strong>THE OVAL OFFICE: POVERTY SIMULATOR</strong><br><br>
                Welcome, Mr. President. Fix the poverty crisis.<br><br>
                Starting Poverty Rate: <strong>10.2%</strong><br>
                National Budget: <strong>$4.0 Trillion</strong><br><br>
                <strong>YOUR GOALS:</strong><br>
                - Survive the Midterms (Cycle 10) by getting poverty to 8.0% or lower.<br>
                - Win Reelection (Cycle 20) by getting poverty to <strong>6.0% or lower</strong>.<br>
                - <strong>WARNING:</strong> If Approval drops below 20%, you are impeached instantly.<br><br>
                Every choice has an unseen ripple effect.
            `;
            
            clearControls();
            createButton("> ENTER THE OVAL OFFICE", () => {
                UI.header.classList.remove('hidden');
                loadScenario();
            });
        }

        window.onload = initGame;
    </script>
</body>
</html>
